<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasis — Company Formation & Business Management</title>
<meta name="description" content="Set up a new company or manage changes to an existing one.">
<meta name="theme-color" content="#0f1f3d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tasis">
<style>
*{box-sizing:border-box;}
:root{
  --navy:#0f1f3d;
  --navy-dark:#0a1730;
  --navy-light:#1b3462;
  --gold:#b8901f;
  --gold-light:#d4af37;
  --bg:#f5f6fa;
  --card:#ffffff;
  --border:#e3e6ee;
  --text:#182238;
  --text-dim:#636d84;
  --text-faint:#9aa2b6;
  --green:#187a4c;
  --green-bg:#e5f6ed;
  --amber:#a86a08;
  --amber-bg:#fcf1dc;
  --blue:#2050b8;
  --blue-bg:#e8eefb;
  --red:#c22e2e;
  --red-bg:#fce9e9;
  --gray:#5c6478;
  --gray-bg:#edeef3;
  --radius:12px;
  --shadow:0 1px 2px rgba(15,31,61,.06), 0 6px 20px rgba(15,31,61,.06);
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{margin:0 0 4px;font-weight:800;color:var(--navy);}
p{margin:0 0 10px;}
a{color:var(--blue);}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:.95rem;}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:60;background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);gap:10px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:7px;font-weight:800;font-size:1.28rem;letter-spacing:.4px;cursor:pointer;color:#fff;text-decoration:none;}
.brand .mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:var(--navy-dark);font-weight:900;font-size:.85rem;}
.ver{font-size:.6rem;opacity:.45;font-weight:600;margin-left:2px;}
.topnav{display:flex;align-items:center;gap:8px;font-size:.82rem;}
.topnav a{color:rgba(255,255,255,.78);text-decoration:none;padding:7px 12px;border-radius:20px;font-weight:600;}
.topnav a:hover{background:rgba(255,255,255,.1);color:#fff;}
.topnav a.active{background:rgba(255,255,255,.14);color:#fff;}

/* ---------- layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:26px 16px 90px;}
.wrap-wide{max-width:1180px;}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.pagehead .sub{color:var(--text-dim);font-size:.88rem;margin-top:2px;}

/* ---------- cards / surfaces ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;}
.card.pad-lg{padding:26px;}
.section-title{font-size:.72rem;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--text-faint);margin:0 0 12px;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:11px 18px;font-size:.88rem;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .08s ease, opacity .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:var(--navy-dark);}
.btn-primary:hover{opacity:.92;}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:var(--navy-light);}
.btn-ghost{background:var(--gray-bg);color:var(--text);}
.btn-ghost:hover{background:#e2e4ec;}
.btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--border);}
.btn-outline:hover{border-color:var(--navy);}
.btn-danger{background:var(--red-bg);color:var(--red);}
.btn-danger:hover{background:#f7d6d6;}
.btn-green{background:var(--green-bg);color:var(--green);}
.btn-green:hover{background:#d3eedd;}
.btn-sm{padding:7px 12px;font-size:.78rem;border-radius:8px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}

/* ---------- forms ---------- */
.field{margin-bottom:16px;}
.field label{display:block;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-dim);margin-bottom:6px;}
.field .hint{font-size:.76rem;color:var(--text-faint);margin-top:5px;}
.field .err{font-size:.78rem;color:var(--red);margin-top:5px;font-weight:600;}
.input,.select,.textarea{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:11px 13px;font-size:.92rem;color:var(--text);background:#fff;outline:none;}
.input:focus,.select:focus,.textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,144,31,.14);}
.textarea{resize:vertical;min-height:80px;}
.input.bad,.select.bad,.textarea.bad{border-color:var(--red);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:620px){.row2,.row3{grid-template-columns:1fr;}}
.radiogroup{display:flex;gap:10px;flex-wrap:wrap;}
.radiopill{border:1.5px solid var(--border);border-radius:9px;padding:9px 14px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--text-dim);user-select:none;}
.radiopill input{margin-right:6px;}
.radiopill.checked{border-color:var(--gold);background:#fdf7e8;color:var(--navy);}
.checkline{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:600;color:var(--text);cursor:pointer;user-select:none;}
.checkline input{width:17px;height:17px;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:5px 10px;border-radius:20px;white-space:nowrap;}
.badge-draft{background:var(--gray-bg);color:var(--gray);}
.badge-submitted{background:var(--blue-bg);color:var(--blue);}
.badge-under_review{background:var(--amber-bg);color:var(--amber);}
.badge-approved{background:var(--green-bg);color:var(--green);}
.badge-rejected{background:var(--red-bg);color:var(--red);}
.badge-pending{background:var(--amber-bg);color:var(--amber);}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

/* ---------- wizard steps ---------- */
.steps{display:flex;justify-content:space-between;margin-bottom:24px;gap:4px;}
.step{flex:1;text-align:center;position:relative;}
.step .circ{width:30px;height:30px;border-radius:50%;background:var(--gray-bg);color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;margin:0 auto 6px;border:2px solid transparent;}
.step .lbl{font-size:.66rem;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.3px;}
.step.active .circ{background:var(--navy);color:#fff;}
.step.active .lbl{color:var(--navy);}
.step.done .circ{background:var(--green);color:#fff;}
.step.done .lbl{color:var(--green);}
.step:not(:last-child):after{content:'';position:absolute;top:15px;left:55%;width:90%;height:2px;background:var(--border);z-index:0;}
.step.done:not(:last-child):after{background:var(--green);}

/* ---------- company / list cards ---------- */
.co-card{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;}
.co-card:hover{border-color:var(--gold);}
.co-card h3{font-size:1.02rem;margin-bottom:4px;}
.co-card .meta{font-size:.78rem;color:var(--text-dim);}
.empty{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty .big{font-size:2.4rem;margin-bottom:10px;}

/* ---------- activity chips ---------- */
.chiplist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:#fff;padding:7px 8px 7px 13px;border-radius:20px;font-size:.8rem;font-weight:600;}
.chip button{background:rgba(255,255,255,.18);border:none;color:#fff;width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:.72rem;line-height:1;}
.actcard{border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;}
.actcard:hover{border-color:var(--gold);background:#fdf9ee;}
.actcard.selected{border-color:var(--green);background:var(--green-bg);}
.actcard .code{font-size:.66rem;font-weight:800;color:var(--text-faint);letter-spacing:.3px;}
.actcard .name{font-weight:700;font-size:.88rem;color:var(--text);}
.actcard .grp{font-size:.72rem;color:var(--text-dim);}
.actcheck{width:18px;height:18px;border-radius:5px;border:2px solid var(--border);flex:0 0 auto;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff;}
.actcard.selected .actcheck{background:var(--green);border-color:var(--green);}
.cat-hd{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);margin:16px 0 8px;}

/* ---------- shareholder rows ---------- */
.sh-card{border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;position:relative;}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.sh-head b{font-size:.86rem;color:var(--navy);}
.pctbar-wrap{position:sticky;bottom:0;background:linear-gradient(0deg,var(--bg) 70%,transparent);padding:14px 0 4px;}
.pctbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);}
.pctbar.ok{border-color:var(--green);}
.pctbar.bad{border-color:var(--red);}
.pctnum{font-weight:800;font-size:1rem;}
.pctnum.ok{color:var(--green);}
.pctnum.bad{color:var(--red);}
.filebtn{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--border);border-radius:9px;padding:10px 14px;font-size:.82rem;font-weight:600;color:var(--text-dim);cursor:pointer;background:#fbfbfd;}
.filebtn:hover{border-color:var(--gold);color:var(--navy);}
.filepreview{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:.8rem;color:var(--text-dim);}
.filepreview img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}
.filepreview .rm{color:var(--red);cursor:pointer;font-weight:700;}

/* ---------- table ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:.84rem;}
table.tbl th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.3px;color:var(--text-faint);padding:8px 10px;border-bottom:2px solid var(--border);}
table.tbl td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.tbl tr:last-child td{border-bottom:none;}

/* ---------- timeline ---------- */
.timeline{list-style:none;margin:0;padding:0;}
.timeline li{display:flex;gap:12px;padding-bottom:16px;position:relative;}
.timeline li:not(:last-child):before{content:'';position:absolute;left:6px;top:18px;bottom:0;width:2px;background:var(--border);}
.timeline .tdot{width:14px;height:14px;border-radius:50%;background:var(--border);flex:0 0 auto;margin-top:3px;}
.timeline li.on .tdot{background:var(--gold);}
.timeline .tlabel{font-weight:700;font-size:.86rem;color:var(--text);}
.timeline .tdate{font-size:.74rem;color:var(--text-faint);}

/* ---------- misc ---------- */
.divider{height:1px;background:var(--border);margin:18px 0;}
.notebox{background:var(--amber-bg);border:1px solid #f0dba9;color:#7a5405;border-radius:10px;padding:12px 14px;font-size:.82rem;margin-bottom:16px;}
.notebox.blue{background:var(--blue-bg);border-color:#c6d7f7;color:#173a8c;}
.notebox.red{background:var(--red-bg);border-color:#f3c4c4;color:#8c1f1f;}
.searchbar{position:relative;margin-bottom:12px;}
.searchbar input{padding-left:36px;}
.searchbar .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-faint);}
.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:2px solid var(--border);overflow-x:auto;}
.tab{padding:10px 16px;font-size:.82rem;font-weight:700;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.tab.active{color:var(--navy);border-color:var(--gold);}
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.pillbtn{border:1.5px solid var(--border);background:#fff;border-radius:20px;padding:7px 14px;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--text-dim);}
.pillbtn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.doclink{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--blue);text-decoration:none;cursor:pointer;}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:560px){.compare{grid-template-columns:1fr;}}
.compare .box{border:1.5px solid var(--border);border-radius:10px;padding:14px;}
.compare .box h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);margin-bottom:8px;}
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;pointer-events:none;}
.toast{background:var(--navy-dark);color:#fff;padding:11px 20px;border-radius:30px;font-size:.85rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastin .2s ease;}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}
@keyframes toastin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:440px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.35);}
.gate{min-height:70vh;display:flex;align-items:center;justify-content:center;}
.gate .card{max-width:380px;width:100%;text-align:center;}
.footer-note{text-align:center;color:var(--text-faint);font-size:.72rem;margin-top:30px;}
.linklike{background:none;border:none;color:var(--blue);font-weight:700;cursor:pointer;font-size:.84rem;padding:0;}
.act-search-list{max-height:360px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:10px;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:700px){.stat-row{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.stat .num{font-size:1.5rem;font-weight:800;color:var(--navy);}
.stat .lbl{font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.3px;font-weight:700;}
</style>
</head>

/* ---------------- data layer (localStorage) ---------------- */
function loadDB(){
  try{ var raw = localStorage.getItem(DB_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return { companies:[], shareholders:[], changeRequests:[] };
}
var DB = loadDB();
function saveDB(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); return true; }
  catch(e){ toast('Local storage is full — try removing an uploaded file or old test company (prototype limit; Phase 2 moves documents to real cloud storage).','err'); return false; }
}
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function esc(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function getCompany(id){ return DB.companies.filter(function(c){return c.id===id;})[0]; }
function shareholdersOf(companyId){ return DB.shareholders.filter(function(s){return s.companyId===companyId;}); }
function changeRequestsOf(companyId){ return DB.changeRequests.filter(function(r){return r.companyId===companyId;}).sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);}); }
function getChangeRequest(id){ return DB.changeRequests.filter(function(r){return r.id===id;})[0]; }

/* ---------------- toast ---------------- */
function toast(msg, kind){
  var wrap = document.getElementById('toastWrap');
  var t = document.createElement('div');
  t.className = 'toast'+(kind==='err'?' err':kind==='ok'?' ok':'');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(function(){ wrap.removeChild(t); },320); }, 2600);
}

/* ---------------- image resize / file handling ---------------- */
function readFileAsCompressedDataURL(file, cb){
  var MAX_DIM = 1800, QUALITY = 0.82;
  if(!/^image\//.test(file.type)){
    if(file.size > 8*1024*1024){ toast('That file is quite large — for the prototype try to keep uploads under 8MB.','err'); }
    var fr0 = new FileReader();
    fr0.onload = function(){ cb({dataUrl:fr0.result, name:file.name, isImage:false}); };
    fr0.readAsDataURL(file);
    return;
  }
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w>h && w>MAX_DIM){ h = Math.round(h*MAX_DIM/w); w = MAX_DIM; }
      else if(h>=w && h>MAX_DIM){ w = Math.round(w*MAX_DIM/h); h = MAX_DIM; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb({dataUrl:canvas.toDataURL('image/jpeg', QUALITY), name:file.name, isImage:true});
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------------- router ---------------- */
window.addEventListener('hashchange', render);
window.addEventListener('load', render);

function render(){
  var h = (location.hash || '#').slice(1);
  var parts = h.split('/').filter(function(x){return x!=='';});
  var app = document.getElementById('app');
  updateTopnav(parts);
  try{
    if(parts[0]==='admin') return renderAdminRoute(parts.slice(1), app);
    if(parts[0]==='new') return renderWizard(app, null);
    if(parts[0]==='edit' && parts[1]) return renderWizard(app, parts[1]);
    if(parts[0]==='company' && parts[1] && parts[2]==='change' && parts[3]==='new') return renderChangeRequestForm(app, parts[1]);
    if(parts[0]==='company' && parts[1]) return renderCompanyDetail(app, parts[1]);
    return renderDashboard(app);
  }catch(e){
    console.error(e);
    app.innerHTML = '<div class="wrap"><div class="notebox red">Something went wrong rendering this page. <button class="linklike" onclick="location.hash=\'\'">Go home</button></div></div>';
  }
}
function updateTopnav(parts){
  var links = document.querySelectorAll('#topnav a');
  links.forEach(function(a){ a.classList.remove('active'); });
  if(parts[0]==='admin') { var a=document.querySelector('[data-nav="admin"]'); if(a) a.classList.add('active'); }
  else { var h=document.querySelector('[data-nav="home"]'); if(h) h.classList.add('active'); }
}

function renderDashboard(app){
  var companies = DB.companies.slice().sort(function(a,b){ return new Date(b.updatedAt)-new Date(a.updatedAt); });
  var html = '<div class="wrap">';
  html += '<div class="pagehead"><div><h1>My Companies</h1><div class="sub">Set up a new company or manage an existing one.</div></div>'
        + '<button class="btn btn-primary" onclick="location.hash=\'new\'">+ Start New Company</button></div>';

  if(!companies.length){
    html += '<div class="card empty">'
          + '<div class="big">🏢</div>'
          + '<h3>No companies yet</h3>'
          + '<p>Start your first company setup — it only takes a few minutes.</p>'
          + '<button class="btn btn-primary" onclick="location.hash=\'new\'">+ Start New Company</button>'
          + '</div>';
  } else {
    companies.forEach(function(c){
      var displayName = c.approvedName || (c.proposedNames[0] && c.proposedNames[0].name) || 'Untitled Company';
      var pending = changeRequestsOf(c.id).filter(function(r){return r.status==='pending'||r.status==='under_review';}).length;
      html += '<div class="co-card" onclick="location.hash=\''+(c.status==='draft'?'edit/'+c.id:'company/'+c.id)+'\'">'
            + '<div><h3>'+esc(displayName)+'</h3>'
            + '<div class="meta">'+esc(c.legalForm||'Legal form not set')+' · Updated '+fmtDate(c.updatedAt)+(pending?' · <b style="color:var(--amber)">'+pending+' pending change request'+(pending>1?'s':'')+'</b>':'')+'</div></div>'
            + '<span class="badge badge-'+c.status+'"><span class="dot"></span>'+STATUS_LABEL[c.status]+'</span>'
            + '</div>';
    });
  }
  html += '<div class="footer-note">Prototype build — data is stored only in this browser (localStorage). Nothing is uploaded to a server yet.</div>';
  html += '</div>';
  app.innerHTML = html;
}

   =================================================================== */
var WIZ = null; /* in-memory working copy of the company + shareholders being edited */
var WIZ_STEP = 1;

function renderWizard(app, companyId){
  if(!WIZ || WIZ.company.id !== companyId && !(companyId===null && WIZ.isNew && !WIZ.saved)){
    if(companyId){
      var existing = getCompany(companyId);
      if(!existing){ toast('That company could not be found.','err'); location.hash=''; return; }
      WIZ = { isNew:false, saved:true, company: JSON.parse(JSON.stringify(existing)), shareholders: JSON.parse(JSON.stringify(shareholdersOf(companyId))) };
    } else {
      WIZ = { isNew:true, saved:false, company: newCompanyDraft(), shareholders:[] };
    }
    WIZ_STEP = 1;
  }
  drawWizard(app);
}

function drawWizard(app){
  var c = WIZ.company;
  var stepDefs = [
    {n:1,l:'Names & Type'}, {n:2,l:'Business Activity'}, {n:3,l:'Shareholders'}, {n:4,l:'Review & Submit'}
  ];
  var html = '<div class="wrap">';
  html += '<div class="pagehead"><div><h1>'+(WIZ.isNew&&!WIZ.saved?'New Company Setup':'Continue Draft')+'</h1><div class="sub">Step '+WIZ_STEP+' of 4</div></div>'
        + '<button class="btn btn-ghost btn-sm" onclick="wizCancel()">Cancel</button></div>';

  html += '<div class="steps">';
  stepDefs.forEach(function(s){
    var cls = s.n===WIZ_STEP ? 'active' : (s.n<WIZ_STEP ? 'done' : '');
    html += '<div class="step '+cls+'"><div class="circ">'+(s.n<WIZ_STEP?'✓':s.n)+'</div><div class="lbl">'+s.l+'</div></div>';
  });
  html += '</div>';

  html += '<div class="card pad-lg">';
  if(WIZ_STEP===1) html += stepNames(c);
  if(WIZ_STEP===2) html += stepActivities(c);
  if(WIZ_STEP===3) html += stepShareholders();
  if(WIZ_STEP===4) html += stepReview(c);
  html += '</div>';

  html += '</div>';
  app.innerHTML = html;
  wireWizardEvents();
}

function validateStep(step){
  var c = WIZ.company;
  if(step===1){
    if(!c.applicantName || !c.applicantEmail) return 'Please enter your name and email.';
    if(!c.legalForm) return 'Please select a legal form.';
    if(!c.proposedNames[0].name) return 'Please enter at least your 1st choice company name.';
  }
  if(step===2){
    if(!c.selectedActivities.length) return 'Please select at least one business activity.';
  }
  if(step===3){
    if(!WIZ.shareholders.length) return 'Please add at least one shareholder.';
    for(var i=0;i<WIZ.shareholders.length;i++){
      var s = WIZ.shareholders[i];
      if(!s.fullName || !s.idNumber || s.ownershipPercent===''||s.ownershipPercent===undefined) return 'Please complete all fields for Shareholder '+(i+1)+'.';
    }
    if(!WIZ.shareholders.some(function(s){return s.isAuthorizedSignatory;})) return 'At least one shareholder must be marked as an authorized signatory.';

var STOPWORDS = ['and','the','will','for','with','that','this','from','are','was','our','but','not','can','all','has','have','also','some','they','them','you','your','their','who','what','when','where','which','into','than','then','been','being','out','off','over','under','only','just','more','most','such','own','same','too','very','get','got','make','made','doing','does','company','business'];
function recommendActivities(text, limit){
  var q = (text||'').toLowerCase();
  var tokens = q.split(/[^a-z0-9]+/).filter(function(t){return t.length>2 && STOPWORDS.indexOf(t)===-1;});
  if(!tokens.length) return [];
  var scored = ACTIVITIES.map(function(a){
    var score = 0;
    var hay = (a.n+' '+a.g+' '+a.k.join(' ')).toLowerCase();
    tokens.forEach(function(t){
      if(a.k.indexOf(t)>-1) score += 5;
      else if(new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(hay)) score += 2;
    });
    return {a:a, score:score};
  }).filter(function(x){return x.score>0;});
  scored.sort(function(x,y){return y.score-x.score;});
  return scored.slice(0, limit||10).map(function(x){
    return {code:x.a.c, name:x.a.n, g:x.a.g};
  });
}

function renderTimeline(c){
  var steps = [
    {k:'draft', l:'Draft Created', d:c.createdAt},
    {k:'submitted', l:'Submitted', d:c.submittedAt},
    {k:'under_review', l:'Under Review', d:c.status==='under_review'||c.status==='approved'||c.status==='rejected' ? c.updatedAt : null},
    {k:'approved', l: c.status==='rejected'?'Rejected':'Approved', d: (c.status==='approved'||c.status==='rejected') ? c.updatedAt : null}
  ];
  var reachedIdx = steps.reduce(function(acc,s,i){ return s.d ? i : acc; }, 0);
  var h = '<ul class="timeline">';
  steps.forEach(function(s,i){
    h += '<li class="'+(i<=reachedIdx && s.d ? 'on':'')+'"><div class="tdot"></div><div><div class="tlabel">'+s.l+'</div><div class="tdate">'+(s.d?fmtDateTime(s.d):'Pending')+'</div></div></li>';
  });
  h += '</ul>';
  return h;
}

      h += '<div class="actcard" style="align-items:center;" onclick="crSetType(\''+t+'\')"><div style="font-size:1.3rem;">'+CR_TYPES[t].icon+'</div><div class="name">'+CR_TYPES[t].label+'</div></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="section-title">'+CR_TYPES[CR_DRAFT.type].icon+' '+CR_TYPES[CR_DRAFT.type].label+' <button class="linklike" style="float:right;" onclick="CR_DRAFT.type=null;render();">change type</button></div>';
    if(CR_DRAFT.type==='name_change') h += crNameChangeForm(c);
    if(CR_DRAFT.type==='activity_add') h += crActivityAddForm(c);
    if(CR_DRAFT.type==='activity_remove') h += crActivityRemoveForm(c);
    if(CR_DRAFT.type==='shareholder_change') h += crShareholderChangeForm(c);
    h += '<div id="crErr" class="field err" style="display:none;"></div>';
    h += '<div class="btn-row"><button class="btn btn-primary" onclick="crSubmit()">Submit Request</button></div>';
  }
  h += '</div></div>';
  app.innerHTML = h;
}
function crSetType(t){ CR_DRAFT.type = t; render(); }
function crNameChangeForm(){
  var h = '<p class="hint" style="margin-bottom:12px;">Propose up to 3 new names in order of preference.</p>';
  [0,1,2].forEach(function(i){
    h += fieldInput('cr_name_'+i, (i===0?'1st Choice':i===1?'2nd Choice':'3rd Choice'), CR_DRAFT.names[i].name, 'text', 'New company name');
  });
  h += '<div class="field"><label>Reason for Change</label><textarea class="textarea" id="f_cr_reason" placeholder="Briefly explain why you want to change the name...">'+esc(CR_DRAFT.reason)+'</textarea></div>';
  return h;
}
function crActivityAddForm(c){
  var existing = c.selectedActivities.map(function(a){return a.code;});
  var h = '<p class="hint" style="margin-bottom:12px;">Search and select the activities you want to add.</p>';
  h += '<div class="searchbar"><span class="ic">🔍</span><input class="input" id="crAddSearch" placeholder="Search activities..." oninput="crFilterAdd(this.value)"></div>';
  h += '<div class="chiplist" id="crAddChips">'+CR_DRAFT.addActivities.map(function(a){return '<span class="chip">'+esc(a.name)+'<button onclick="crToggleAdd(\''+a.code+'\')">✕</button></span>';}).join('')+'</div>';
  h += '<div class="act-search-list" id="crAddList">'+crAddBrowseHtml('', existing)+'</div>';
  return h;
}
function crAddBrowseHtml(q, existing){
  q = (q||'').toLowerCase();
  var selCodes = CR_DRAFT.addActivities.map(function(a){return a.code;});
  var h='';
  ACTIVITIES.forEach(function(a){
    if(existing.indexOf(a.c)>-1) return;
    if(q && (a.n+a.g+a.k.join(' ')).toLowerCase().indexOf(q)===-1) return;
    var sel = selCodes.indexOf(a.c)>-1;
    h += '<div class="actcard'+(sel?' selected':'')+'" onclick="crToggleAdd(\''+a.c+'\')"><div class="actcheck">'+(sel?'✓':'')+'</div><div><div class="name">'+esc(a.n)+'</div><div class="code">'+esc(a.c)+' · '+esc(a.g)+'</div></div></div>';
  });
  return h || '<p class="hint">No matches.</p>';
}
function crFilterAdd(q){ document.getElementById('crAddList').innerHTML = crAddBrowseHtml(q, getCompany(CR_DRAFT.companyId).selectedActivities.map(function(a){return a.code;})); }
function crToggleAdd(code){
  var idx = CR_DRAFT.addActivities.findIndex(function(a){return a.code===code;});
  if(idx>-1) CR_DRAFT.addActivities.splice(idx,1);
  else { var a = ACTIVITIES.filter(function(x){return x.c===code;})[0]; if(a) CR_DRAFT.addActivities.push({code:a.c,name:a.n}); }
  render();
}
function crActivityRemoveForm(c){
  var h = '<p class="hint" style="margin-bottom:12px;">Select which current activities to remove. At least one must remain.</p>';
  c.selectedActivities.forEach(function(a){
    var sel = CR_DRAFT.removeActivities.indexOf(a.code)>-1;
    h += '<div class="actcard'+(sel?' selected':'')+'" onclick="crToggleRemove(\''+a.code+'\')"><div class="actcheck">'+(sel?'✓':'')+'</div><div class="name">'+esc(a.name)+'</div></div>';
  });
  return h;
}
function crToggleRemove(code){
  var idx = CR_DRAFT.removeActivities.indexOf(code);
  if(idx>-1) CR_DRAFT.removeActivities.splice(idx,1); else CR_DRAFT.removeActivities.push(code);
  render();
}
function crShareholderChangeForm(c){
  var sh = shareholdersOf(c.id);
  var h = '<div class="field"><label>Action</label><div class="radiogroup">';
  [['add','Add New Shareholder'],['edit','Edit Existing Shareholder'],['remove','Remove Shareholder']].forEach(function(o){
    h += '<label class="radiopill'+(CR_DRAFT.shAction===o[0]?' checked':'')+'"><input type="radio" name="shaction" value="'+o[0]+'" '+(CR_DRAFT.shAction===o[0]?'checked':'')+' onchange="crSetShAction(\''+o[0]+'\')">'+o[1]+'</label>';
  });
  h += '</div></div>';

  if(CR_DRAFT.shAction!=='add'){
    h += '<div class="field"><label>Select Shareholder</label><select class="select" id="f_shTarget" onchange="crSetShTarget(this.value)"><option value="">Choose…</option>'
       + sh.map(function(s){ return '<option value="'+s.id+'"'+(CR_DRAFT.shTargetId===s.id?' selected':'')+'>'+esc(s.fullName)+' ('+s.ownershipPercent+'%)</option>'; }).join('')
       + '</select></div>';
  }
  if(CR_DRAFT.shAction==='add' || CR_DRAFT.shAction==='edit'){
    var s = CR_DRAFT.sh;
    h += '<div class="row2">'
       + '<div class="field"><label>Full Name</label><input class="input" id="f_sh_fullName" value="'+esc(s.fullName)+'"></div>'
       + '<div class="field"><label>Nationality</label><input class="input" id="f_sh_nationality" value="'+esc(s.nationality)+'"></div></div>';
    h += '<div class="field"><label>ID Type</label><div class="radiogroup">'
       + ['national_id','passport'].map(function(t){ return '<label class="radiopill'+(s.idType===t?' checked':'')+'"><input type="radio" name="sh_idtype" value="'+t+'" '+(s.idType===t?'checked':'')+' onchange="CR_DRAFT.sh.idType=\''+t+'\';render();">'+(t==='national_id'?'National ID':'Passport')+'</label>'; }).join('')
       + '</div></div>';
    h += '<div class="row2">'
       + '<div class="field"><label>ID Number</label><input class="input" id="f_sh_idNumber" value="'+esc(s.idNumber)+'"></div>'
       + '<div class="field"><label>Ownership %</label><input class="input" id="f_sh_ownershipPercent" type="number" value="'+esc(s.ownershipPercent)+'"></div></div>';
    h += '<label class="checkline"><input type="checkbox" id="f_sh_signatory" '+(s.isAuthorizedSignatory?'checked':'')+'> Authorized Signatory</label>';
    h += '<div class="field" style="margin-top:12px;"><label>ID Document</label>';
    if(s.idDocDataUrl) h += '<div class="filepreview">'+(s.idDocIsImage?'<img src="'+s.idDocDataUrl+'">':'<span>📄</span>')+'<span>'+esc(s.idDocName)+'</span><span class="rm" onclick="CR_DRAFT.sh.idDocDataUrl=\'\';render();">Remove</span></div>';
    else h += '<label class="filebtn">📎 Choose file<input type="file" accept="image/*,.pdf" style="display:none;" onchange="crUploadShDoc(this)"></label>';
    h += '</div>';
  }
  if(CR_DRAFT.shAction==='remove'){
    h += '<div class="notebox red">Removing a shareholder will require the remaining shareholders\' ownership to be rebalanced — our team will confirm the new percentages with you.</div>';
  }
  return h;
}
function crSetShAction(a){ CR_DRAFT.shAction=a; render(); }
function crSetShTarget(id){
  CR_DRAFT.shTargetId = id;
  if(CR_DRAFT.shAction==='edit'){
    var s = DB.shareholders.filter(function(x){return x.id===id;})[0];
    if(s) CR_DRAFT.sh = JSON.parse(JSON.stringify(s));
  }
  render();
}
function crUploadShDoc(input){
  var file = input.files[0]; if(!file) return;
  readFileAsCompressedDataURL(file, function(res){
    CR_DRAFT.sh.idDocDataUrl = res.dataUrl; CR_DRAFT.sh.idDocName = res.name; CR_DRAFT.sh.idDocIsImage = res.isImage;
    render();
  });
}
function crSyncFields(){
  if(CR_DRAFT.type==='name_change'){
    [0,1,2].forEach(function(i){ CR_DRAFT.names[i] = {name: val('f_cr_name_'+i), rank:i+1}; });
    CR_DRAFT.reason = val('f_cr_reason');
  }
  if(CR_DRAFT.type==='shareholder_change' && (CR_DRAFT.shAction==='add'||CR_DRAFT.shAction==='edit')){
    CR_DRAFT.sh.fullName = val('f_sh_fullName'); CR_DRAFT.sh.nationality = val('f_sh_nationality');
    CR_DRAFT.sh.idNumber = val('f_sh_idNumber'); CR_DRAFT.sh.ownershipPercent = val('f_sh_ownershipPercent');
    var sig = document.getElementById('f_sh_signatory'); CR_DRAFT.sh.isAuthorizedSignatory = sig ? sig.checked : false;
  }
}
function crSubmit(){
  crSyncFields();
  var err = null, details = {};
  if(CR_DRAFT.type==='name_change'){
    if(!CR_DRAFT.names[0].name) err = 'Please enter at least a 1st choice name.';
    details = { newNames: CR_DRAFT.names, reason: CR_DRAFT.reason };
  } else if(CR_DRAFT.type==='activity_add'){
    if(!CR_DRAFT.addActivities.length) err = 'Please select at least one activity to add.';
    details = { activities: CR_DRAFT.addActivities };
  } else if(CR_DRAFT.type==='activity_remove'){
    var c = getCompany(CR_DRAFT.companyId);
    if(!CR_DRAFT.removeActivities.length) err = 'Please select at least one activity to remove.';
    else if(CR_DRAFT.removeActivities.length >= c.selectedActivities.length) err = 'You must keep at least one business activity.';
    details = { activities: CR_DRAFT.removeActivities.map(function(code){ return c.selectedActivities.filter(function(a){return a.code===code;})[0]; }) };
  } else if(CR_DRAFT.type==='shareholder_change'){
    if(CR_DRAFT.shAction!=='add' && !CR_DRAFT.shTargetId) err = 'Please select which shareholder this applies to.';
    if(!err && (CR_DRAFT.shAction==='add'||CR_DRAFT.shAction==='edit')){
      if(!CR_DRAFT.sh.fullName || !CR_DRAFT.sh.idNumber || CR_DRAFT.sh.ownershipPercent==='') err = 'Please complete the shareholder\'s details.';
    }
    details = { action: CR_DRAFT.shAction, targetShareholderId: CR_DRAFT.shTargetId, shareholder: CR_DRAFT.sh };
  }
  if(err){ var e = document.getElementById('crErr'); e.style.display='block'; e.textContent = err; return; }
  var cr = { id:uid(), companyId:CR_DRAFT.companyId, type:CR_DRAFT.type, details:details, status:'pending', adminNotes:'', createdAt:nowISO(), updatedAt:nowISO() };
  DB.changeRequests.push(cr);
  saveDB();
  toast('Change request submitted.','ok');
  CR_DRAFT = null;
  location.hash = 'company/'+cr.companyId;
}

   =================================================================== */
function isAdminUnlocked(){ return sessionStorage.getItem(ADMIN_SESSION_KEY)==='1'; }
function renderAdminRoute(parts, app){
  if(!isAdminUnlocked()) return renderAdminGate(app);
  if(parts[0]==='company' && parts[1]) return renderAdminCompany(app, parts[1]);
  if(parts[0]==='change' && parts[1]) return renderAdminChange(app, parts[1]);
  return renderAdminDashboard(app);
}
function renderAdminGate(app){
  app.innerHTML = '<div class="wrap gate"><div class="card">'
    + '<h2 style="margin-bottom:6px;">Admin Access</h2>'
    + '<p class="hint" style="margin-bottom:16px;">Placeholder passcode gate for this prototype — real staff accounts arrive in Phase 2.</p>'
    + '<div class="field"><input class="input" type="password" id="adminPass" placeholder="Passcode" onkeydown="if(event.key===\'Enter\')adminUnlock()"></div>'
    + '<button class="btn btn-primary btn-block" onclick="adminUnlock()">Enter Admin</button>'
    + '</div></div>';
}
function adminUnlock(){
  var v = document.getElementById('adminPass').value;
  if(v===ADMIN_PASSCODE){ sessionStorage.setItem(ADMIN_SESSION_KEY,'1'); render(); }
  else toast('Incorrect passcode.','err');
}
function adminLogout(){ sessionStorage.removeItem(ADMIN_SESSION_KEY); location.hash=''; }

var ADMIN_TAB = 'new';
var ADMIN_FILTER = 'all';
function renderAdminDashboard(app){
  var companies = DB.companies.slice().sort(function(a,b){return new Date(b.updatedAt)-new Date(a.updatedAt);});
  var changeReqs = DB.changeRequests.slice().sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);});

  var newSubs = companies.filter(function(c){return c.status==='submitted'||c.status==='under_review';});
  var pendingCR = changeReqs.filter(function(r){return r.status==='pending'||r.status==='under_review';});

  var h = '<div class="wrap wrap-wide">';
  h += '<div class="pagehead"><div><h1>Admin Dashboard</h1><div class="sub">Review new submissions and change requests.</div></div><button class="btn btn-ghost btn-sm" onclick="adminLogout()">Log Out</button></div>';

  h += '<div class="stat-row">'
     + '<div class="stat"><div class="num">'+companies.length+'</div><div class="lbl">Total Companies</div></div>'
     + '<div class="stat"><div class="num">'+newSubs.length+'</div><div class="lbl">New Submissions</div></div>'
     + '<div class="stat"><div class="num">'+pendingCR.length+'</div><div class="lbl">Pending Changes</div></div>'
     + '<div class="stat"><div class="num">'+companies.filter(function(c){return c.status==='approved';}).length+'</div><div class="lbl">Approved</div></div>'
     + '</div>';

  h += '<div class="tabs">'
     + tabBtn('new','New Submissions ('+newSubs.length+')')
     + tabBtn('changes','Change Requests ('+pendingCR.length+')')
     + tabBtn('all','All Companies ('+companies.length+')')
     + '</div>';

  h += '<div id="adminTabBody">';
  if(ADMIN_TAB==='new') h += adminListCompanies(newSubs, true);
  if(ADMIN_TAB==='changes') h += adminListChangeRequests(changeReqs);
  if(ADMIN_TAB==='all') h += adminAllCompaniesView(companies);
  h += '</div></div>';
  app.innerHTML = h;
}
function tabBtn(k,l){ return '<div class="tab'+(ADMIN_TAB===k?' active':'')+'" onclick="adminSetTab(\''+k+'\')">'+l+'</div>'; }
function adminSetTab(k){ ADMIN_TAB=k; ADMIN_FILTER='all'; renderAdminDashboard(document.getElementById('app')); }
function adminListCompanies(list){
  if(!list.length) return '<div class="empty card"><div class="big">📭</div><p>Nothing here right now.</p></div>';
  var h='';
  list.forEach(function(c){
    var name = c.approvedName || c.proposedNames[0].name || 'Untitled';
    h += '<div class="co-card" onclick="location.hash=\'admin/company/'+c.id+'\'"><div><h3>'+esc(name)+'</h3><div class="meta">'+esc(c.applicantName||'')+' · '+esc(c.legalForm||'')+' · Submitted '+fmtDate(c.submittedAt)+'</div></div><span class="badge badge-'+c.status+'">'+STATUS_LABEL[c.status]+'</span></div>';
  });
  return h;
}
function adminAllCompaniesView(companies){
  var filters = ['all','draft','submitted','under_review','approved','rejected'];
  var h = '<div class="filter-row">'+filters.map(function(f){
    return '<button class="pillbtn'+(ADMIN_FILTER===f?' active':'')+'" onclick="adminSetFilter(\''+f+'\')">'+(f==='all'?'All':STATUS_LABEL[f])+'</button>';
  }).join('')+'</div>';
  var filtered = ADMIN_FILTER==='all' ? companies : companies.filter(function(c){return c.status===ADMIN_FILTER;});
  h += adminListCompanies(filtered);
  return h;
}
function adminSetFilter(f){ ADMIN_FILTER=f; renderAdminDashboard(document.getElementById('app')); }
function adminListChangeRequests(list){
  if(!list.length) return '<div class="empty card"><div class="big">📭</div><p>No change requests yet.</p></div>';

  });

function adminViewDoc(shareholderId){
  var s = DB.shareholders.filter(function(x){return x.id===shareholderId;})[0];

  if(s.idDocIsImage) w.document.write('<title>'+esc(s.fullName)+' — ID Document</title><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="'+s.idDocDataUrl+'" style="max-width:100%;max-height:100vh;"></body>');
  else w.document.write('<title>'+esc(s.fullName)+' — ID Document</title><iframe src="'+s.idDocDataUrl+'" style="border:none;width:100vw;height:100vh;"></iframe>');
}
function adminSaveCompany(id){

  c.registrationNumber = val('adminRegNo');
  c.adminNotes = val('adminNotes');

function renderChangeCompare(r,c){
  var h = '<div class="section-title">Requested Change</div>';
  if(r.type==='name_change'){
    h += '<div class="compare"><div class="box"><h4>Current</h4>'+c.proposedNames.map(function(n,i){return '<p>'+(i+1)+'. '+esc(n.name||'—')+'</p>';}).join('')+'</div>'
       + '<div class="box"><h4>Requested</h4>'+r.details.newNames.map(function(n,i){return '<p>'+(i+1)+'. '+esc(n.name||'—')+'</p>';}).join('')+(r.details.reason?'<p class="hint">Reason: '+esc(r.details.reason)+'</p>':'')+'</div></div>';
  } else if(r.type==='activity_add'){
    h += '<p>Add:</p>'+r.details.activities.map(function(a){return '<p>+ '+esc(a.name)+'</p>';}).join('');
  } else if(r.type==='activity_remove'){
    h += '<p>Remove:</p>'+r.details.activities.map(function(a){return '<p>− '+esc(a.name)+'</p>';}).join('');
  } else if(r.type==='shareholder_change'){
    var d = r.details;
    h += '<p><b>Action:</b> '+(d.action==='add'?'Add new shareholder':d.action==='edit'?'Edit existing shareholder':'Remove shareholder')+'</p>';
    if(d.action!=='add'){
      var target = DB.shareholders.filter(function(s){return s.id===d.targetShareholderId;})[0];
      h += '<p><b>Shareholder:</b> '+esc(target?target.fullName:'Unknown')+'</p>';
    }
    if(d.action!=='remove'){
      var s = d.shareholder;
      h += '<div class="box" style="margin-top:10px;"><p>Name: '+esc(s.fullName)+'</p><p>Nationality: '+esc(s.nationality||'—')+'</p><p>ID: '+(s.idType==='passport'?'Passport':'National ID')+' '+esc(s.idNumber)+'</p><p>Ownership: '+s.ownershipPercent+'%</p><p>Signatory: '+(s.isAuthorizedSignatory?'Yes':'No')+'</p>'
         + (s.idDocDataUrl ? '<p><a class="doclink" onclick="adminViewChangeDoc(\''+r.id+'\')">View Document</a></p>' : '')
         + '</div>';
    }
  }
  return h;
}
function adminViewChangeDoc(rid){
  var r = getChangeRequest(rid);
  var s = r.details.shareholder;
  if(!s || !s.idDocDataUrl) return;
  var w = window.open('');
  if(!w){ toast('Please allow pop-ups to view documents.','err'); return; }
  if(s.idDocIsImage) w.document.write('<img src="'+s.idDocDataUrl+'" style="max-width:100%;">');
  else w.document.write('<iframe src="'+s.idDocDataUrl+'" style="border:none;width:100vw;height:100vh;"></iframe>');
}
function adminRejectChange(id){
  var r = getChangeRequest(id);
  r.adminNotes = val('crAdminNotes');
  r.status = 'rejected';
  r.updatedAt = nowISO();
  saveDB();
  toast('Change request rejected.','ok');
  render();
}
function adminApproveChange(id){
  var r = getChangeRequest(id);
  var c = getCompany(r.companyId);
  if(r.type==='name_change'){
    c.proposedNames = r.details.newNames;
  } else if(r.type==='activity_add'){
    r.details.activities.forEach(function(a){
      if(!c.selectedActivities.some(function(x){return x.code===a.code;})) c.selectedActivities.push(a);
    });
  } else if(r.type==='activity_remove'){
    var removeCodes = r.details.activities.map(function(a){return a.code;});
    c.selectedActivities = c.selectedActivities.filter(function(a){return removeCodes.indexOf(a.code)===-1;});
  } else if(r.type==='shareholder_change'){
    var d = r.details;
    if(d.action==='add'){
      var s = JSON.parse(JSON.stringify(d.shareholder));
      s.id = uid(); s.companyId = c.id;
      DB.shareholders.push(s);
    } else if(d.action==='edit'){
      var idx = DB.shareholders.findIndex(function(x){return x.id===d.targetShareholderId;});
      if(idx>-1){ var keepId=DB.shareholders[idx].id; DB.shareholders[idx] = Object.assign({}, d.shareholder, {id:keepId, companyId:c.id}); }
    } else if(d.action==='remove'){
      DB.shareholders = DB.shareholders.filter(function(x){return x.id!==d.targetShareholderId;});
    }
    var total = shareholdersOf(c.id).reduce(function(t,s){return t+(parseFloat(s.ownershipPercent)||0);},0);
    if(Math.round(total*100)/100 !== 100) toast('Applied — note ownership now totals '+Math.round(total*100)/100+'%, not 100%. You may want to follow up.','err');
  }
  r.status = 'approved';
  r.updatedAt = nowISO();
  c.updatedAt = nowISO();
  saveDB();
  toast('Change approved and applied.','ok');
  render();
}

/* ---------------- init ---------------- */
render();
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
